name: 📚 Data contribution / correction
description: Add a dataset, or report an error in existing translations/tafaseer/hadith.
title: "[data]: "
labels: ["data", "scholarly-review"]
body:
  - type: markdown
    attributes:
      value: |
        Data contributions are the most valuable kind here — thank you!
        Please remember: **source everything, keep it authentic, and record licensing.**
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - New dataset (translation / tafseer / hadith / corpus)
        - Correction to existing data
        - Missing or misaligned verses
        - Metadata / attribution fix
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What data are you adding or correcting? Be specific.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: URL or bibliographic reference for the data.
      placeholder: "e.g. https://quranenc.com or a book/edition reference"
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License / copyright status
      description: License of the data if known, or "needs verification".
      placeholder: "e.g. public domain, CC BY, or needs verification"
  - type: textarea
    id: files
    attributes:
      label: Files / scope
      description: Which files or records are affected? What's the expected record count?
